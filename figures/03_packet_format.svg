<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="295" viewBox="0 0 1360 295"><title>Format frame SENTINEL dan pembentukan nonce</title><defs><marker id="a" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11Z" fill="#111"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<text x="45" y="29" font-size="25" font-weight="700" text-anchor="start">Frame maksimum 112 byte</text>
<rect x="40" y="47" width="365.7142857142857" height="74" rx="0" fill="#EEEEEE" stroke="#111" stroke-width="2"/>
<text x="222.85714285714286" y="76.59" font-size="23" font-weight="400" text-anchor="middle">Header 32 byte</text>
<text x="222.85714285714286" y="106.59" font-size="23" font-weight="400" text-anchor="middle">Associated data</text>
<rect x="405.7142857142857" y="47" width="731.4285714285714" height="74" rx="0" fill="white" stroke="#111" stroke-width="2"/>
<text x="771.4285714285714" y="76.59" font-size="23" font-weight="400" text-anchor="middle">Ciphertext L byte</text>
<text x="771.4285714285714" y="106.59" font-size="23" font-weight="400" text-anchor="middle">1 ≤ L ≤ 64</text>
<rect x="1137.142857142857" y="47" width="182.85714285714286" height="74" rx="0" fill="#EEEEEE" stroke="#111" stroke-width="2"/>
<text x="1228.5714285714284" y="76.59" font-size="23" font-weight="400" text-anchor="middle">Tag</text>
<text x="1228.5714285714284" y="106.59" font-size="23" font-weight="400" text-anchor="middle">16 byte</text>
<text x="44" y="157" font-size="23" font-weight="700" text-anchor="start">Rincian header dan offset byte</text>
<rect x="40" y="187" width="40" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="60.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">V</text>
<text x="40" y="178" font-size="18" font-weight="400" text-anchor="start">0</text>
<rect x="80" y="187" width="40" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="100.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">OP</text>
<text x="80" y="178" font-size="18" font-weight="400" text-anchor="start">1</text>
<rect x="120" y="187" width="80" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="160.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">L</text>
<text x="120" y="178" font-size="18" font-weight="400" text-anchor="start">2</text>
<rect x="200" y="187" width="160" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="280.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">Destination</text>
<text x="200" y="178" font-size="18" font-weight="400" text-anchor="start">4</text>
<rect x="360" y="187" width="320" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="520.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">Session ID</text>
<text x="360" y="178" font-size="18" font-weight="400" text-anchor="start">8</text>
<rect x="680" y="187" width="320" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="840.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">Sequence</text>
<text x="680" y="178" font-size="18" font-weight="400" text-anchor="start">16</text>
<rect x="1000" y="187" width="320" height="54" rx="0" fill="#F7F7F7" stroke="#111" stroke-width="2"/>
<text x="1160.0" y="220.93" font-size="21" font-weight="400" text-anchor="middle">Reserved</text>
<text x="1000" y="178" font-size="18" font-weight="400" text-anchor="start">24</text>
<text x="1320" y="178" font-size="18" font-weight="400" text-anchor="middle">32</text>
<text x="680" y="282" font-size="25" font-weight="400" text-anchor="middle">Nonce 128 bit = LE64(session_id) || LE64(sequence)</text>
</svg>